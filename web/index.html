<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>herdr-router</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="logo" aria-hidden="true"></span>
    <h1>herdr-router</h1>
    <span class="muted mono" id="source"></span>
  </div>
  <div class="actions">
    <span class="dirty" id="dirty" hidden>未保存</span>
    <button id="btn-revert" class="ghost" title="放弃全部未保存的修改，恢复到上次保存的配置">放弃修改</button>
    <button id="btn-defaults" class="ghost" title="把编辑器内容换成内置默认值（仍需保存）">默认值</button>
    <button id="btn-save" class="primary" title="保存（⌘S）">保存</button>
  </div>
</header>
<nav class="tabs" id="tabs" aria-label="配置编辑器视图">
  <button data-tab="chart" class="on">路由图</button>
  <button data-tab="dims">维度</button>
  <button data-tab="trial">试运行</button>
  <button data-tab="settings">设置</button>
  <button data-tab="json">JSON</button>
</nav>
<div id="errors" class="errors" role="alert" hidden></div>
<main id="main" aria-label="路由配置工作区"><p class="muted pad" role="status">加载中…</p></main>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script src="/app.js"></script>
</body>
</html>
