<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>herdr-router</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="logo" aria-hidden="true"></span>
    <h1>herdr-router</h1>
    <span class="muted mono" id="source"></span>
  </div>
  <div class="actions">
    <span class="dirty" id="dirty" hidden data-i18n="unsaved">Unsaved</span>
    <button id="btn-revert" class="ghost" data-i18n-title="discard_title" title="Discard all unsaved changes" data-i18n="discard_changes">Discard changes</button>
    <button id="btn-defaults" class="ghost" data-i18n-title="defaults_title" title="Load built-in defaults" data-i18n="defaults">Defaults</button>
    <button id="btn-save" class="primary" data-i18n-title="save_title" title="Save (⌘/Ctrl+S)" data-i18n="save">Save</button>
  </div>
</header>
<nav class="tabs" id="tabs" data-i18n-aria-label="editor_views" aria-label="Configuration editor views">
  <button data-tab="chart" class="on" data-i18n="routing_map">Routing map</button>
  <button data-tab="dims" data-i18n="dimensions">Dimensions</button>
  <button data-tab="trial" data-i18n="try_routing">Try routing</button>
  <button data-tab="settings" data-i18n="settings">Settings</button>
  <button data-tab="json" data-i18n="json">JSON</button>
</nav>
<div id="errors" class="errors" role="alert" hidden></div>
<main id="main" data-i18n-aria-label="workspace" aria-label="Routing configuration workspace"><p class="muted pad" role="status" data-i18n="loading">Loading…</p></main>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script src="/i18n.js"></script>
<script src="/app.js"></script>
</body>
</html>
